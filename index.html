<h1>Troy Work Drive</h1>
<p>供账号持有人自用的 Google Drive 文件连接工具，连接个人工作目录与本人使用的远程 Agent。</p>
<p>经账号持有人授权后，工具可以列出、读取和下载工作文件，并按任务要求上传工作成果及交接文件。工具使用 Google Drive API，由 rclone 执行文件访问。</p>
<p>本页面介绍连接工具。工作文件的访问由 Google 账号授权及文件共享设置管理。</p>
<p><a href="privacy.html">隐私说明 / Privacy notice</a></p>
<p>联系：Google 授权页面列出的支持邮箱。</p>
